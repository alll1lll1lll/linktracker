syntax = "proto3";

package backend.academy.linktracker.grpc;

option java_package = "backend.academy.linktracker.grpc";
option java_multiple_files = true;

service BotService {
  rpc SendUpdate (LinkUpdateMsg) returns (Empty);
}

message LinkUpdateMsg {
  int64 id = 1;
  string url = 2;
  string description = 3;
  repeated int64 tgChatIds = 4;
}

message Empty {}
