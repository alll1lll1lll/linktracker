version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: scrapper_db
    environment:
      POSTGRES_USER: scrapper
      POSTGRES_PASSWORD: password
      POSTGRES_DB: scrapper
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
